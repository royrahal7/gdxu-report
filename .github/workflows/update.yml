name: Update GDXU report

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, Monday to Friday, after the US close
  workflow_dispatch:           # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python gdxu_report.py
      - name: Save the updated page
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html report_log.csv
          git diff --cached --quiet || git commit -m "Update GDXU report"
          git push
