name: Update GDXU report

on:
  schedule:
    - cron: "40 13-20 * * 1-5"   # hourly while the US market is open (UTC)
    - cron: "30 22 * * 1-5"      # after the close
  workflow_dispatch:

concurrency:
  group: gdxu-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python gdxu_site.py
      - name: Save the updated page
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html report_log.csv daily_log.csv
          git diff --cached --quiet || git commit -m "Update GDXU report"
          git pull --rebase
          git push
